# Documentation/reference only -- NOT parsed by cara_sweep.sh. The actual
# block injected into each case's TRACE_control.input is the hardcoded
# heredoc in inject_bc_control_block() (see CHANGELOG in cara_sweep.sh).
control file: |
  all immediate SetBoundaryControlSet EvaluationPanel_v inlet VelocityTheta Mass
  all immediate SetBoundaryControlSet ControPanel_v inlet VelocityAngleThetaAbs Mass
  all immediate SetBoundaryConditionController -op Scale 110.968 0.1 0.0500 2000 -cPanel ControPanel_v -ePanel EvaluationPanel_v -it 5000 400 -o ../output/residual/bcControl_v.dat -res 1e-4

