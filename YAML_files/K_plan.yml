# Nested sweep plan.
#
# outer: the variable you hold fixed at each of `values` in turn. Must be
#        a key in the VAR_KEY registry in cara_sweep.sh, and must NOT be
#        "magnitude" mode (step_height can't be an outer variable -- it's
#        list-valued, inner-only).
#        Optional `fmt` overrides the registry's printf format for how
#        the outer value appears in case names (default: registry's fmt).
#        NOTE: this "outer:" block is the pre-existing NESTED-LOOP
#        feature (sweep every inner: entry once per outer value) -- it
#        is unrelated to the per-entry outer_variation_pct*/outer_points*
#        OUTER-BAND feature below, despite the similar name. The two can
#        be combined if needed.
#
# inner: the variables swept (one at a time, others at baseline) at
#        EVERY outer value (or just once, flat, if no outer: block is
#        live). Each entry needs fields matching that variable's mode:
#          - direct / derived_pr / magnitude -> variation_pct, points
#          - interval                        -> start, end, points
#
#        BANDS (direct / derived_pr / magnitude entries only, not
#        interval variables like swirl/fin_angle): an optional `bands:`
#        field controls which region of the +/-variation_pct ...
#        +/-(variation_pct+outer_variation_pct) space actually gets
#        simulated for that entry:
#
#          bands: inner  (the default when no outer_ fields are present)
#              -> just the plain +/-variation_pct sweep, `points` values.
#                 Unchanged original behavior.
#
#          bands: outer  (the default when outer band fields ARE present
#                         and `bands` is omitted -- kept for backward
#                         compatibility)
#              -> ONLY the two bands OUTSIDE +/-variation_pct, out to
#                 +/-(variation_pct+outer_variation_pct). The inner
#                 +/-variation_pct region is NOT re-simulated -- use this
#                 once you've already run that region in an earlier
#                 sweep. `points` isn't needed in this mode (variation_pct
#                 is only the anchor marking where the outer bands start)
#                 and is ignored if present.
#
#          bands: both
#              -> BOTH the inner sweep (`points` values in
#                 +/-variation_pct) AND the outer bands beyond it,
#                 submitted together from one entry.
#
#        variation_pct is always required (it's the inner/outer boundary
#        either way).
#
#        Two ways to specify the outer band width/density:
#
#          SYMMETRIC (original, still supported):
#            outer_variation_pct: <pct>
#            outer_points: <n>
#          Same percent both sides; `outer_points` is split
#          floor(n/2) negative / ceil(n/2) positive (extra point, if
#          any, goes to the positive side).
#
#          ASYMMETRIC (new -- lets the negative and positive outer bands
#          have different widths and different point counts):
#            outer_variation_pct_neg: <pct>   outer_points_neg: <n>
#            outer_variation_pct_pos: <pct>   outer_points_pos: <n>
#          All four must be given together (partial sets are dropped
#          with a warning -- the entry falls back to no outer band, or
#          to `bands: inner` only if bands: both). Setting a side's
#          points to 0 drops that side entirely (one-sided band). These
#          four fields take precedence over outer_variation_pct/
#          outer_points if both styles are somehow present on the same
#          entry.
#
#        BOUNDARY-DUPLICATE FIX: the +/-variation_pct point itself is
#        the edge of the *inner* sweep (or, for bands: outer, the edge
#        of whatever inner sweep you already ran separately). The outer
#        band is conceptually anchored there but no longer re-emits that
#        exact value -- it generates its points starting just beyond the
#        boundary, spaced as if the boundary point were still part of
#        the grid. So you never get two simulations landing on the same
#        +/-variation_pct value.
#
#        Whichever fields a given `bands` mode needs must be present, or
#        the entry is skipped with a warning.
#
#        Example (symmetric): variation_pct: 5, outer_variation_pct: 40,
#        outer_points: 4, bands: outer -> 2 points in (-45%, -5%), 2
#        points in (+5%, +45%) (the +/-5% boundary itself excluded,
#        already covered by the inner sweep), and the +/-5% region
#        itself is left alone (not re-run).
#
#        Example (asymmetric): variation_pct: 5, outer_variation_pct_neg: 40,
#        outer_points_neg: 6, outer_variation_pct_pos: 15, outer_points_pos: 2,
#        bands: outer -> 6 points in (-45%, -5%), 2 points in (+5%, +20%).
#
# K_in: the run-wide inlet swirl ratio workflow constant. Can be either
#       a single scalar:
#           K_in: 0.7
#       or a list, in which case the ENTIRE sweep (whichever mode you
#       pick when the script runs -- YAML-driven or interactive) is run
#       once per K value, back to back, in an outer loop around
#       everything else:
#           K_in: [0.2, 0.5, 0.7]
#       Each case name is still prefixed with its own K value (see
#       CASE-NAME CONVENTION in cara_sweep.sh), so cases from different
#       K passes never collide.
K_in: [0.6]

